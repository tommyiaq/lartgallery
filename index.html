<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LART Gallery | Linktree</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { height: 100%; }

    body {
      font-family: 'IBM Plex Sans', sans-serif;
      background-color: #D8D8D6;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 0;
    }

    /* ── Profile (on gray background) ── */
    .profile {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      text-align: center;
      padding: 0 24px 28px;
      width: 100%;
      max-width: 420px;
    }

    .avatar {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      object-fit: cover;
      border: 2.5px solid rgba(255,255,255,0.6);
    }

    .profile-name {
      font-size: 20px;
      font-weight: 600;
      color: #1a1a1a;
      letter-spacing: -0.01em;
    }

    .profile-bio {
      font-size: 15px;
      font-weight: 400;
      color: #1a1a1a !important;
      line-height: 1.5;
      text-decoration: none;
      -webkit-text-fill-color: #1a1a1a;
    }

    /* ── White card column ── */
    .card {
      background: #fff;
      border-radius: 24px;
      width: 100%;
      max-width: 420px;
      padding-bottom: 32px;
    }

    /* ── Top bar inside card ── */
    .card-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px 8px;
    }

    .topbar-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: none;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #1a1a1a;
      transition: background 0.15s;
    }

    .topbar-btn:hover { background: rgba(0,0,0,0.06); }

    .toast {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%) translateY(16px);
      background: #1a1a1a;
      color: #fff;
      font-size: 13px;
      font-weight: 500;
      padding: 10px 18px;
      border-radius: 999px;
      opacity: 0;
      transition: opacity 0.2s ease, transform 0.2s ease;
      pointer-events: none;
      white-space: nowrap;
      z-index: 200;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ── Sections ── */
    .links-section {
      padding: 8px 16px 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .section-label {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #1a1a1a;
      text-align: center;
      padding: 8px 0 2px;
    }

    /* ── Artist button ── */
    .artist-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #f9f9f9;
      border: 1px solid rgba(0,0,0,0.08);
      border-radius: 12px;
      padding: 10px 10px 10px 16px;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      text-align: left;
      width: 100%;
      gap: 12px;
      color: #1a1a1a;
      font-family: inherit;
    }

    .artist-btn:hover { background: #f0f0f0; }
    .artist-btn:active { transform: scale(0.985); }

    .artist-btn-text { flex: 1; min-width: 0; }

    .artist-btn-name {
      font-size: 14px;
      font-weight: 500;
      color: #1a1a1a;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .artist-btn-meta {
      font-size: 12px;
      color: #777;
      margin-top: 2px;
    }

    .artist-btn-thumb {
      width: 52px;
      height: 52px;
      border-radius: 8px;
      object-fit: cover;
      object-position: right center;
      flex-shrink: 0;
    }

    /* ── Social icons ── */
    .social-icons {
      display: flex;
      gap: 16px;
      justify-content: center;
      padding: 24px 0 8px;
    }

    .social-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 48px;
      height: 48px;
      text-decoration: none;
      transition: opacity 0.15s;
      color: #1a1a1a;
    }

    .social-icon:hover { opacity: 0.7; }
    .social-icon svg { width: 32px; height: 32px; }

    /* ── Modal overlay ── */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      z-index: 100;
      display: none;
      align-items: flex-end;
      justify-content: center;
    }

    .overlay.open {
      display: flex;
      animation: fadeIn 0.2s ease;
    }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    .modal {
      background: #fff;
      width: 100%;
      max-width: 480px;
      border-radius: 20px 20px 0 0;
      overflow: hidden;
      animation: slideUp 0.3s ease;
      max-height: 92vh;
      overflow-y: auto;
    }

    @keyframes slideUp {
      from { transform: translateY(60px); opacity: 0; }
      to   { transform: translateY(0);    opacity: 1; }
    }

    .modal-header {
      position: sticky;
      top: 0;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px 10px;
      border-bottom: 1px solid rgba(0,0,0,0.07);
      z-index: 10;
    }

    .modal-header-title {
      font-size: 13px;
      font-weight: 500;
      color: #1a1a1a;
    }

    .modal-header-meta {
      font-size: 12px;
      color: #666;
    }

    .modal-close {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 1px solid rgba(0,0,0,0.1);
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.15s;
    }

    .modal-close:hover { background: #f0f0f0; }

    .modal-cover {
      width: 100%;
      aspect-ratio: 16/9;
      object-fit: cover;
    }

    .modal-body {
      padding: 20px 20px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      text-align: center;
    }

    .modal-title {
      font-size: 18px;
      font-weight: 600;
      color: #1a1a1a;
      line-height: 1.3;
      text-decoration: underline;
      text-decoration-color: rgba(0,0,0,0.2);
      text-underline-offset: 3px;
      cursor: pointer;
    }

    .modal-title:hover { text-decoration-color: rgba(0,0,0,0.6); }

    .modal-by {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: #555;
    }

    .modal-by-avatar {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      object-fit: cover;
    }

    .modal-price {
      font-size: 15px;
      font-weight: 500;
      color: #1a1a1a;
    }

    .modal-download {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #1a1a1a;
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 14px 24px;
      font-size: 15px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      text-decoration: none;
      width: 100%;
      justify-content: center;
      transition: opacity 0.15s;
    }

    .modal-download:hover { opacity: 0.85; }

    .modal-desc {
      font-size: 13px;
      color: #555;
      line-height: 1.6;
      text-align: left;
      width: 100%;
    }

    .modal-files { width: 100%; text-align: left; }

    .modal-files-label {
      font-size: 12px;
      font-weight: 600;
      color: #999;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 10px;
    }

    .modal-file-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 0;
      border-top: 1px solid rgba(0,0,0,0.07);
    }

    .modal-file-icon {
      width: 32px;
      height: 32px;
      border-radius: 6px;
      background: #f3f3f3;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .modal-file-name {
      font-size: 13px;
      color: #1a1a1a;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .modal-file-type { font-size: 11px; color: #888; }
  </style>
</head>

<script>
  const artists = {
    alberto: {
      name: 'Alberto La Tassa',
      title: 'Alberto La Tassa - Catalogue 2026',
      image: 'assets/images/alberto-la-tassa.jpeg',
      pdf: 'assets/pdfs/Alberto La Tassa - Catalogue 2026.pdf',
      file: 'Alberto La Tassa - Catalogue 2026.pdf',
      desc: 'This catalog showcases the contemporary art collection of Alberto La Tassa, featuring oil paintings and mixed media pieces with descriptions and pricing for each work. Explore the artist\'s unique style and diverse range of techniques.'
    },
    femke: {
      name: 'Femke de Groot',
      title: 'Femke de Groot - Catalogue 2026',
      image: 'assets/images/femke-de-groot.jpeg',
      pdf: 'assets/pdfs/Femke de Groot - Catalogue 2026.pdf',
      file: 'Femke de Groot - Catalogue 2026.pdf',
      desc: 'Discover the contemporary works of Femke de Groot — a compelling collection of paintings and mixed media with detailed descriptions and pricing for collectors and art enthusiasts.'
    },
    leonardo: {
      name: 'Leonardo Cappellini',
      title: 'Leonardo Cappellini - Art Gallery 2026',
      image: 'assets/images/leonardo-cappellini.jpeg',
      pdf: 'assets/pdfs/Leonardo Cappellini - Art Gallery 2026.pdf',
      file: 'Leonardo Cappellini - Art Gallery 2026.pdf',
      desc: 'A curated selection of works by Leonardo Cappellini, presented by LART Gallery. This catalogue offers a comprehensive view of the artist\'s current production, with pricing and detailed notes.'
    },
    salvador: {
      name: 'Salvador Dalì',
      title: 'Salvador Dalí - Graphic Artworks 2026',
      image: 'assets/images/salvador-dali.jpeg',
      pdf: 'assets/pdfs/Salvador Dalí - Graphic Artworks 2026.pdf',
      file: 'Salvador Dalí - Graphic Artworks 2026.pdf',
      desc: 'An exclusive selection of graphic artworks by Salvador Dalí, one of the most iconic figures of Surrealism. This catalogue documents authenticated works available through LART Gallery.'
    },
    picasso: {
      name: 'Pablo Picasso',
      title: 'Pablo Picasso - Catalogue 2026',
      image: 'assets/images/pablo-picasso.jpeg',
      pdf: 'assets/pdfs/Pablo Picasso - Catalogue 2026.pdf',
      file: 'Pablo Picasso - Catalogue 2026.pdf',
      desc: 'A prestigious selection of works by Pablo Picasso, spanning multiple periods of his legendary career. Each piece is documented with provenance, medium and pricing information.'
    },
    chagall: {
      name: 'Marc Chagall',
      title: 'Marc Chagall - Artworks Catalogue 2026',
      image: 'assets/images/marc-chagall.jpeg',
      pdf: 'assets/pdfs/Marc Chagall - Artworks Catalogue 2026.pdf',
      file: 'Marc Chagall - Artworks Catalogue 2026.pdf',
      desc: 'Explore the dreamlike and poetic universe of Marc Chagall through this curated catalogue of artworks, presented by LART Gallery with full documentation and pricing.'
    }
  };

  function openModal(id) {
    const a = artists[id];
    document.getElementById('modal-header-title').textContent = a.name;
    const titleEl = document.getElementById('modal-title');
    titleEl.textContent = a.title;
    titleEl.href = a.pdf;
    titleEl.download = a.file;
    document.getElementById('modal-cover').src = a.image;
    document.getElementById('modal-cover').alt = a.title;
    document.getElementById('modal-download').href = a.pdf;
    const fileRow = document.getElementById('modal-file-row');
    fileRow.href = a.pdf;
    fileRow.download = a.file;
    document.getElementById('modal-desc').textContent = a.desc;
    document.getElementById('modal-file-name').textContent = a.file;
    document.getElementById('overlay').classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function closeModal() {
    document.getElementById('overlay').classList.remove('open');
    document.body.style.overflow = '';
  }

  function closeModalOnOverlay(e) {
    if (e.target === document.getElementById('overlay')) closeModal();
  }

  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

  function copyLink() {
    const url = 'https://tommyiaq.github.io/lartgallery/';

    const confirm = () => {
      const btn = document.getElementById('copy-btn');
      const toast = document.getElementById('toast');
      btn.innerHTML = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`;
      toast.classList.add('show');
      setTimeout(() => {
        toast.classList.remove('show');
        btn.innerHTML = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v8a2 2 0 002 2h12a2 2 0 002-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>`;
      }, 2000);
    };

    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).then(confirm);
    } else {
      const el = document.createElement('textarea');
      el.value = url;
      el.style.cssText = 'position:fixed;top:-9999px;left:-9999px;opacity:0';
      document.body.appendChild(el);
      el.focus();
      el.select();
      try { document.execCommand('copy'); confirm(); } catch(e) {}
      document.body.removeChild(el);
    }
  }
</script>
